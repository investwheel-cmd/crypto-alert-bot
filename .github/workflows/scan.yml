name: Crypto 4H Scanner

on:
  schedule:
    # Runs at minute 5 past every 4th hour, UTC (00:05, 04:05, 08:05, ...).
    # A few minutes' offset from the exact hour avoids GitHub's busiest
    # scheduling window, which reduces the chance of a delayed run.
    - cron: "5 */4 * * *"
  workflow_dispatch: {}   # lets you trigger a run manually from the Actions tab

permissions:
  contents: write         # needed so the workflow can commit the state file back

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python crypto_alert_bot.py

      - name: Commit updated state file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/alerted.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Update alert state [skip ci]"
          git push
